[package]
name = "mcp-duxca-com"
version = "0.1.0"
edition = "2021"
resolver = "2"
rust-version = "1.85"
description = "MCP gateway for mcp.duxca.com (Axum + OAuth + relay)"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
dotenvy = "0.15"
hmac = "0.13"
oauth2 = "5.0"
envy = "0.4"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

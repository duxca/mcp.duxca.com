[package]
name = "mcp-duxca-com"
version = "0.1.0"
edition = "2021"
resolver = "2"
description = "MCP gateway for mcp.duxca.com (Axum + swappable backends)"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
dotenvy = "0.15"
envy = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
